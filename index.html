<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B201C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pemo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="pemo — วางแผนทริป จดค่าใช้จ่าย หารเงินกับเพื่อน">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>pemo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column; trips shown as boarding passes, trip view has sticky header + bottom tab bar, forms in a bottom sheet */
:root{
  --bg:#F7F5EF; --card:#FFFFFF; --ink:#29312B; --mute:#6A7169; --line:#E7E5DE;
  --sage:#82977D; --sage-strong:#5F755A; --sage-ink:#FFFFFF; --soft:#EFEDE6; --butter:#EACB75; --butter-ink:#3A3014;
  --good:#4E7A49; --bad:#B0533F; --shadow:0 1px 2px rgba(41,49,43,.05),0 8px 22px rgba(41,49,43,.06);
  --f-display:"Mitr","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B201C; --card:#242B25; --ink:#EDEBE3; --mute:#A4AB9F; --line:#343C35;
  --sage:#9AAE94; --sage-strong:#A9BCA3; --sage-ink:#1B201C; --soft:#2C342D; --butter:#E3C46C; --butter-ink:#2B240C;
  --good:#8FC487; --bad:#E58C78; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B201C; --card:#242B25; --ink:#EDEBE3; --mute:#A4AB9F; --line:#343C35;
  --sage:#9AAE94; --sage-strong:#A9BCA3; --sage-ink:#1B201C; --soft:#2C342D; --butter:#E3C46C; --butter-ink:#2B240C;
  --good:#8FC487; --bad:#E58C78; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.top h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--soft);border-radius:999px;min-width:38px;height:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.me-chip{font-weight:500;max-width:46vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:18px;padding-block:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:17px}
.sec-h small{color:var(--mute)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.muted{color:var(--mute)}
.small{font-size:13px}
.banner{background:var(--butter);color:var(--butter-ink);border-radius:12px;padding:10px 14px;font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--sage-strong);color:var(--sage-ink)}
.btn.butter{background:var(--butter);color:var(--butter-ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1}

/* boarding pass */
.pass{display:flex;width:100%;text-align:left;border:0;padding:0;background:transparent;filter:drop-shadow(0 4px 10px rgba(10,50,55,.10))}
.pass-main{flex:1;min-width:0;background:var(--card);border-radius:16px 0 0 16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;
  -webkit-mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.pass-stub{width:112px;flex:none;background:var(--sage-strong);color:var(--sage-ink);border-radius:0 16px 16px 0;padding:14px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-left:2px dashed color-mix(in srgb,var(--sage-ink) 45%,transparent);
  -webkit-mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.pass-code{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.pass-name{font-family:var(--f-display);font-size:19px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pass-meta{font-size:13px;color:var(--mute)}
.pass-stub .lbl{font-size:11px;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.pass-stub b{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.pass.big .pass-main{padding:18px}
.pass.big .pass-name{font-size:23px}
.pass.big .pass-stub{width:132px}
.pass.big .pass-stub b{font-size:21px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12.5px;color:var(--mute)}
.stat .v{font-family:var(--f-display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.bar-row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .amt{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.bar{grid-column:1/-1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar i.m{background:var(--butter)}
.split-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft);grid-column:1/-1}
.split-bar i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:middle}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--mute);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* list */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .em{width:40px;height:40px;flex:none;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item .am{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;flex:none}
.item .am small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--ink);vertical-align:1px}
.pill.shared{background:var(--sage-strong);color:var(--sage-ink)}
.pill.personal{background:var(--butter);color:var(--butter-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sage-strong);border-color:var(--sage-strong);color:var(--sage-ink)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:4px}
.day-h h3{font-size:15.5px}
.day-badge{font-family:var(--f-display);background:var(--butter);color:var(--butter-ink);border-radius:8px;padding:0 8px;font-size:13px;margin-right:6px}
.act{display:grid;grid-template-columns:52px 28px minmax(0,1fr);gap:8px;align-items:start;padding:7px 0;border:0;background:transparent;text-align:left;width:100%;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:0}
.act .tm{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;padding-top:2px}
.act .tt{overflow-wrap:anywhere}
.empty{text-align:center;padding:26px 16px;color:var(--mute)}
.empty .big{font-size:40px}
.transfer{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.transfer:last-child{border-bottom:0}
.transfer .who{overflow-wrap:anywhere}
.transfer .who:last-child{text-align:right}
.transfer .mid{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;background:var(--butter);color:var(--butter-ink);border-radius:10px;padding:4px 10px;white-space:nowrap}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;font-size:11.5px;color:var(--mute)}
nav.tabs button .e{font-size:21px;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--sage-strong);font-weight:600}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:99px;background:var(--butter);color:var(--butter-ink);font-weight:600;padding:14px 20px;box-shadow:0 8px 22px rgba(0,0,0,.18);font-size:15.5px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(5,20,22,.45);border:0}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-card{animation:none}}
.sheet-card h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:13px;color:var(--mute);font-weight:500}
.inp{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.inp.amount{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 6px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:12.5px}
.cats button .e{font-size:22px}
.cats button[aria-pressed="true"]{border-color:var(--sage);background:var(--soft);font-weight:600}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:42px;font-size:21px}
.emojis button[aria-pressed="true"]{border-color:var(--sage);background:var(--soft)}
.slip{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--card)}
.slip img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.slip label{cursor:pointer}
.hint{font-size:12.5px;color:var(--mute)}
.share-img{width:100%;border-radius:14px;box-shadow:var(--shadow)}
.slip-view{width:100%;border-radius:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:-.01em}
.hero{background:var(--soft);border-radius:22px;padding:24px 20px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero .mascot-card{background:var(--card);border-radius:24px;padding:18px 22px;box-shadow:var(--shadow)}
.hero h1{font-size:28px;font-weight:500;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mute);max-width:32ch}
.hero .btn{margin-top:6px}
.hero .tag{font-size:12.5px;color:var(--mute);letter-spacing:.04em}
.pemo-svg{display:block;flex:none}
.empty .pemo-svg{margin:0 auto 6px}
.hello h1{font-size:26px}
.hello p{margin:2px 0 0;color:var(--mute)}
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .em{font-size:26px;width:40px;text-align:center}
.mem .tx{flex:1;min-width:0}
.mem .tx b{font-weight:500}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="iconbtn" id="backBtn" data-act="home" aria-label="กลับหน้าแรก" hidden>←</button>
  <h1 id="topTitle" class="brand"><b>pemo</b></h1>
  <button class="iconbtn me-chip" id="meChip" data-act="profile">🙂 โปรไฟล์</button>
</div></header>
<main><div class="wrap" id="app">
  <div class="empty card"><p>กำลังโหลดแพลนของแก๊ง…</p></div>
</div></main>
<nav class="tabs" id="tabs" hidden><div class="wrap">
  <button data-act="tab" data-tab="sum"><span class="e">📊</span>สรุป</button>
  <button data-act="tab" data-tab="exp"><span class="e">🧾</span>ค่าใช้จ่าย</button>
  <button data-act="tab" data-tab="plan"><span class="e">🗓️</span>แผนเที่ยว</button>
  <button data-act="tab" data-tab="settle"><span class="e">💸</span>หารเงิน</button>
  <button data-act="tab" data-tab="gang"><span class="e">👥</span>แก๊ง</button>
</div></nav>
<button class="fab" id="fab" data-act="newExp" hidden>＋ เพิ่มค่าใช้จ่าย</button>
<div id="sheet" hidden><button class="sheet-back" data-act="close" aria-label="ปิด"></button><div class="sheet-card" id="sheetBody"></div></div>
<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,"") : Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,16);
const clean = o => JSON.parse(JSON.stringify(o));
const nf = new Intl.NumberFormat("th-TH",{maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("th-TH",{maximumFractionDigits:0});

const CATS = [
  {k:"food",e:"🍜",n:"กินดื่ม"},{k:"shop",e:"🛍️",n:"ของใช้/ช้อป"},{k:"travel",e:"🚕",n:"เดินทาง"},
  {k:"stay",e:"🏨",n:"ที่พัก"},{k:"fun",e:"🎢",n:"กิจกรรม/ตั๋ว"},{k:"other",e:"✨",n:"อื่นๆ"}];
const CAT = Object.fromEntries(CATS.map(c=>[c.k,c]));
const CUR = {THB:"฿",JPY:"¥",KRW:"₩",TWD:"NT$",CNY:"CN¥",HKD:"HK$",SGD:"S$",VND:"₫",MYR:"RM",USD:"$",EUR:"€",GBP:"£",CHF:"CHF ",AUD:"A$",NZD:"NZ$",LAK:"₭",IDR:"Rp",PHP:"₱",INR:"₹",AED:"AED "};
const COUNTRIES = [["ญี่ปุ่น","🇯🇵","JPY"],["เกาหลีใต้","🇰🇷","KRW"],["ไต้หวัน","🇹🇼","TWD"],["จีน","🇨🇳","CNY"],["ฮ่องกง","🇭🇰","HKD"],["สิงคโปร์","🇸🇬","SGD"],["เวียดนาม","🇻🇳","VND"],["มาเลเซีย","🇲🇾","MYR"],["ลาว","🇱🇦","LAK"],["อินโดนีเซีย","🇮🇩","IDR"],["ฟิลิปปินส์","🇵🇭","PHP"],["อินเดีย","🇮🇳","INR"],["ดูไบ","🇦🇪","AED"],["อังกฤษ","🇬🇧","GBP"],["ฝรั่งเศส","🇫🇷","EUR"],["อิตาลี","🇮🇹","EUR"],["เยอรมนี","🇩🇪","EUR"],["สวิตเซอร์แลนด์","🇨🇭","CHF"],["อเมริกา","🇺🇸","USD"],["ออสเตรเลีย","🇦🇺","AUD"],["นิวซีแลนด์","🇳🇿","NZD"],["ไทย","🇹🇭","THB"]];
const MEMBER_EMOJI = ["😎","🤓","🥳","😺","🐻","🐼","🦊","🐸","🐧","🦄","👧","👦","👩","👨","👵","👴","👶","🧑‍💻"];
const ACT_EMOJI = ["📍","✈️","🚆","🏨","🍜","☕","🏯","⛩️","🛍️","🎢","📸","🌸","🏔️","🏖️","🍻","😴"];

  uid:null,meName:"",noDb:false,canWrite:true,wrote:false,loaded:false,

const pDate = s => { const [y,m,d] = String(s||"").split("-").map(Number); return y ? new Date(y,m-1,d) : null; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayIso = () => iso(new Date());
const fmtD = s => { const d = pDate(s); return d ? d.toLocaleDateString("th-TH",{day:"numeric",month:"short"}) : "ไม่ระบุวัน"; };
const fmtDW = s => { const d = pDate(s); return d ? d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"}) : "ไม่ระบุวัน"; };
function tripDays(t){
  const a = pDate(t?.start), b = pDate(t?.end); if(!a) return [];
  const out = []; const end = b && b >= a ? b : a; const d = new Date(a);
  while(d <= end && out.length < 90){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
const dateRange = t => t?.start ? `${fmtD(t.start)}${t.end && t.end!==t.start ? " – "+fmtD(t.end) : ""}` : "ยังไม่ใส่วัน";
const flagOf = t => t?.flag || "🌍";
const rateOf = (t,cur) => cur==="THB" ? 1 : (+((t?.rates||{})[cur]) || (cur===(t?.currency||"THB") ? +t?.rate||0 : 0));
const expCur = (t,e) => e.currency || t?.currency || "THB";
const expRate = (t,e) => { const c=expCur(t,e); return c==="THB" ? 1 : (+e.rate>0 ? +e.rate : rateOf(t,c)); };
function baseOf(list){
  const cs=new Set(); let ok=true;
  for(const t of list) for(const e of tExps(t.id)){ cs.add(expCur(t,e)); if(!(expRate(t,e)>0)) ok=false; }
  if(ok || cs.size!==1) return {base:"THB",missing:!ok};
  return {base:[...cs][0],missing:false};
}
const fxTo = (base,t,e) => base==="THB" ? expRate(t,e) : (expCur(t,e)===base ? 1 : 0);
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }
function errText(e){
  if(e?.code==="storage") return "บันทึกลงเครื่องไม่ได้ พื้นที่อาจเต็ม";
  const c = e?.code;
  if(c==="invalid_argument") return "รายการนี้ถูกลบไปแล้ว ลองรีเฟรชดูนะ";
  if(c==="quota_exceeded") return "พื้นที่เก็บข้อมูลเต็มแล้ว ลองลบรายการเก่าที่ไม่ใช้";
  if(c==="resource_exhausted") return "กดเร็วไปนิด รอสักครู่แล้วลองใหม่";
  return "ยังบันทึกไม่ได้ ลองใหม่อีกครั้งนะ";
}
async function save(p,msg){

}

/* ---------- money math ---------- */
function ledger(list, merge){
  const {base:cur,missing:missingRate} = baseOf(list);
  const P = new Map();
  const keyOf = (m) => merge ? (m.uid ? "u:"+m.uid : "n:"+String(m.name||"").trim().toLowerCase()) : m.id;
  const tot = {total:0,shared:0,personal:0,byCat:{},byDay:{},count:0};
  for(const t of list){
    const mk = {};
    for(const m of members(t)){
      const k = keyOf(m); mk[m.id]=k;
      if(!P.has(k)) P.set(k,{key:k,id:m.id,name:m.name||"?",emoji:m.emoji||"🙂",family:String(m.family||"").trim(),uid:m.uid||null,paid:0,personal:0,share:0});
      else if(!P.get(k).family && m.family) P.get(k).family = String(m.family).trim();
    }
    for(const e of tExps(t.id)){
      const a = (+e.amount||0)*fxTo(cur,t,e); if(!a) continue;
      tot.total+=a; tot.count++;
      tot.byCat[e.cat||"other"]=(tot.byCat[e.cat||"other"]||0)+a;
      const day = e.date||"";
      const D = tot.byDay[day] ||= {total:0,shared:0,personal:0,items:0,cats:{}};
      D.total+=a; D.items++; D.cats[e.cat||"other"]=(D.cats[e.cat||"other"]||0)+a;
      const payer = mk[e.paidBy];
      if(payer) P.get(payer).paid += a;
      if(e.type==="personal"){ tot.personal+=a; D.personal+=a; if(payer) P.get(payer).personal += a; }
      else {
        tot.shared+=a; D.shared+=a;
        let sp = (Array.isArray(e.split)?e.split:[]).filter(id=>mk[id]);
        if(!sp.length) sp = Object.keys(mk);
        if(sp.length){ const each=a/sp.length; sp.forEach(id=>P.get(mk[id]).share += each); }
      }
    }
  }
  const people=[...P.values()];
  people.forEach(p=>{p.consumed=p.personal+p.share; p.net=p.paid-p.consumed;});
  return {cur,tot,people,missingRate,fx:(t,e)=>fxTo(cur,t,e)};
}
function byFamily(people){
  const F=new Map();
  for(const p of people){
    const k = p.family || ("solo:"+p.key);
    if(!F.has(k)) F.set(k,{key:k,name:p.family||p.name,emoji:p.family?"🏠":p.emoji,family:!!p.family,members:[],paid:0,personal:0,share:0,consumed:0,net:0});
    const f=F.get(k); f.members.push(p.name); ["paid","personal","share","consumed","net"].forEach(x=>f[x]+=p[x]);
  }
  return [...F.values()];
}
function settle(rows){
  const d=rows.filter(r=>r.net<-0.005).map(r=>({r,v:-r.net})).sort((a,b)=>b.v-a.v);
  const c=rows.filter(r=>r.net>0.005).map(r=>({r,v:r.net})).sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<d.length && j<c.length){
    const x=Math.min(d[i].v,c[j].v); if(x>=0.01) out.push({from:d[i].r,to:c[j].r,amt:x});
    d[i].v-=x; c[j].v-=x; if(d[i].v<0.005) i++; if(c[j].v<0.005) j++;
  }
  return out;
}
function linkedGroup(id){
  const seen=new Set([id]), q=[id];
  while(q.length){
    const cur=q.shift(), t=S.trips.get(cur);
    (t?.links||[]).forEach(l=>{ if(!seen.has(l)&&S.trips.has(l)){seen.add(l);q.push(l);} });
    for(const [oid,o] of S.trips) if((o.links||[]).includes(cur)&&!seen.has(oid)){seen.add(oid);q.push(oid);}
  }
  return [...seen].map(x=>S.trips.get(x)).filter(Boolean);
}

      ${L.people.map(p=>`<tr><td>${p.emoji} ${esc(p.name)}</td><td>${money(p.personal,null,L.cur)}</td><td>${money(p.share,null,L.cur)}</td><td><b>${money(p.consumed,null,L.cur)}</b></td></tr>`).join("")}

function fxBreakdown(t){
  const m={}; for(const e of tExps(t.id)){ const c=expCur(t,e), r=expRate(t,e); const x=m[c] ||= {cur:c,amt:0,thb:0,rate:r}; x.amt+=+e.amount||0; x.thb+=(+e.amount||0)*(r||0); if(r>0) x.rate=r; }
  const rows=Object.values(m); return rows.some(r=>r.cur!=="THB") ? rows.sort((a,b)=>b.thb-a.thb) : [];
}
function expRow(t,e,L){
  const c=CAT[e.cat]||CAT.other, payer=mById(t,e.paidBy);
  const sp=(e.split||[]).filter(id=>mById(t,id)); const n = sp.length || members(t).length || 1;
  const sub = e.type==="personal" ? `<span class="pill personal">ส่วนตัว</span> ${esc(payer?.name||"?")}`
    : `<span class="pill shared">หาร ${n}</span> ${esc(payer?.name||"?")} จ่าย`;
  return `<button class="item" data-act="editExp" data-id="${esc(e.id)}"><span class="em">${c.e}</span>
    <span class="tx"><div class="t1">${esc(e.title||c.n)}${e.slipUrl||e.slipData?" 🧾":""}</div><div class="t2">${sub}</div></span>
    <span class="am">${money(e.amount,null,expCur(t,e))}${expCur(t,e)!==L.cur?`<small>≈ ${money((+e.amount||0)*L.fx(t,e),null,L.cur)}</small>`:""}${e.type!=="personal"?`<small>${money((+e.amount||0)*L.fx(t,e)/n,null,L.cur)}/คน</small>`:""}</span></button>`;
}
function expView(t){
  const me=myMember(t); const L=ledger([t],false);
  let list=tExps(t.id);
  const f=S.expFilter;
  if(f==="shared") list=list.filter(e=>e.type!=="personal");
  if(f==="personal") list=list.filter(e=>e.type==="personal");
  if(f==="mine" && me) list=list.filter(e=>e.paidBy===me.id || (e.type!=="personal" && ((e.split||[]).length? e.split.includes(me.id):true)));
  const chips=[["all","ทั้งหมด"],["shared","🤝 ร่วม"],["personal","🙋 ส่วนตัว"]].concat(me?[["mine","⭐ ที่เกี่ยวกับฉัน"]]:[]);
  let h=`<div class="chips">${chips.map(([k,n])=>`<button class="chip" data-act="expFilter" data-k="${k}" aria-pressed="${f===k}">${n}</button>`).join("")}</div>`;
  if(L.missingRate) h+=`<div class="banner">💱 บางรายการยังไม่มีอัตราแลกเปลี่ยนเป็นบาท แตะรายการนั้นแล้วใส่เรทได้เลย</div>`;
  if(!list.length) return h+`<div class="card empty">${pemo(70,"sleepy")}<p>ยังไม่มีรายการในหมวดนี้</p></div>`;
  const groups={}; list.forEach(e=>(groups[e.date||""] ||= []).push(e));
  const dayIdx = Object.fromEntries(tripDays(t).map((d,i)=>[d,i+1]));
  Object.keys(groups).sort().forEach(d=>{
    const arr=groups[d].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); const sum=arr.reduce((s,e)=>s+(+e.amount||0)*L.fx(t,e),0);
    h+=`<section class="sec"><div class="day-h"><h3>${dayIdx[d]?`<span class="day-badge">D${dayIdx[d]}</span>`:""}${fmtDW(d)}</h3><span class="num muted">${money(sum,null,L.cur)}</span></div><div class="card list">${arr.map(e=>expRow(t,e,L)).join("")}</div></section>`;
  });
  return h;
}

function planView(t){
  const days=tripDays(t); const acts=tActs(t.id); const L=ledger([t],false);
  if(!days.length) return `<div class="card empty">${pemo(80,"sleepy")}<p>ใส่วันไป-กลับในแท็บ “แก๊ง” ก่อน แล้วจะมีช่องให้วางแผนแต่ละวัน</p></div>`;
  return days.map((d,i)=>{
    const a=acts.filter(x=>x.date===d).sort((x,y)=>String(x.time||"99").localeCompare(String(y.time||"99")));

    return `<section class="sec"><div class="day-h"><h3><span class="day-badge">Day ${i+1}</span>${fmtDW(d)}</h3><span class="num muted small">💸 ${money(spent,null,L.cur)}</span></div>

  if(tc!=="THB" && tr>0) data.rates={[tc]:tr};

  }
}

async function compressImg(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    return {blob,canvas:c};
  } finally { URL.revokeObjectURL(url); }
}
async function onSlipFile(file){

    F.blob=blob; F.slipUrl=""; F.slipId=""; F.slipData="";
    if(F.preview) URL.revokeObjectURL(F.preview); F.preview=URL.createObjectURL(blob);
    const box=$("#slipBox"); let img=$("#slipImg");
    if(!img){ box.firstElementChild.outerHTML=`<img id="slipImg" alt="สลิป">`; img=$("#slipImg"); }

}

/* ---------- local store (this phone) ---------- */
let DEV=null;
let RS={trips:{},expenses:{},activities:{},profiles:{},meta:{}};
const IDB={
  db:null,
  open(){ return this.db ||= new Promise((res,rej)=>{ const r=indexedDB.open("pemo",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ const d=await this.open(); return new Promise((res,rej)=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const tx=d.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
};
let persistP=Promise.resolve();
function persist(){
  persistP = persistP.then(()=>IDB.set("state",RS)).catch(()=>{ try{ localStorage.setItem("pemo-state",JSON.stringify(RS)); }catch{ toast("บันทึกลงเครื่องไม่ได้ พื้นที่อาจเต็ม"); } });
  return persistP;
}
function derive(){
  S.trips=new Map(Object.values(RS.trips).filter(t=>!t._d).map(t=>[t.id,t]));
  S.exps=Object.values(RS.expenses).filter(e=>!e._d && RS.trips[e.tripId]);
  S.acts=Object.values(RS.activities).filter(a=>!a._d && RS.trips[a.tripId]);
  S.profiles=new Map(Object.entries(RS.profiles));
}
function commit(){ derive(); scheduleRender(); return persist(); }
const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
function deepMerge(a,b){ const o={...a}; for(const k in b){ o[k]= isObj(a?.[k])&&isObj(b[k]) ? deepMerge(a[k],b[k]) : b[k]; } return o; }
function stampMembers(prev,next){
  const P=new Map(prev.map(m=>[m.id,m])), out=[], now=Date.now();
  const strip=x=>JSON.stringify({...x,_u:0,_by:0});
  for(const m of next){ const p=P.get(m.id); out.push(p && strip(p)===strip(m) ? p : {...m,_u:now,_by:DEV}); P.delete(m.id); }
  for(const p of P.values()) out.push(p._d ? p : {...p,_d:true,_u:now,_by:DEV});
  return out;
}
function stamp(c,doc,prev){
  doc._u=Date.now(); doc._by=DEV; delete doc._d;
  if(c==="trips" && Array.isArray(doc.members)) doc.members=stampMembers(prev?.members||[],doc.members);
  return doc;
}
const LDB={ doc(path){ const [c,id]=path.split("/"); return {
  async set(data){ RS[c][id]=stamp(c,{...clean(data),id},RS[c][id]); await commit(); },
  async update(data){ const cur=RS[c][id]; if(!cur||cur._d) throw {code:"invalid_argument"}; RS[c][id]=stamp(c,deepMerge(cur,clean(data)),cur); await commit(); },
  async delete(){ const cur=RS[c][id]; if(!cur) return;
    if(c==="trips"){ // removing a trip only clears it from this phone
      delete RS.trips[id]; delete RS.meta[id];
      for(const k in RS.expenses) if(RS.expenses[k].tripId===id) delete RS.expenses[k];
      for(const k in RS.activities) if(RS.activities[k].tripId===id) delete RS.activities[k];
    } else RS[c][id]={id,tripId:cur.tripId,_d:true,_u:Date.now(),_by:DEV};
    await commit(); }
}; } };

/* ---------- merge engine ---------- */
const newer=(a,b)=> (b._u||0)>(a._u||0) || ((b._u||0)===(a._u||0) && String(b._by||"")>String(a._by||""));
function mergeDoc(a,b){ if(!a) return b; if(!b) return a; return newer(a,b)?b:a; }
function mergeTrip(a,b){
  if(!a) return b;
  const win=newer(a,b)?b:a, lose=win===a?b:a;
  const M=new Map((lose.members||[]).map(m=>[m.id,m]));
  for(const m of (win.members||[])) M.set(m.id, mergeDoc(M.get(m.id),m));
  return {...win, members:[...M.values()], rates:{...(lose.rates||{}),...(win.rates||{})},
    links:[...new Set([...(a.links||[]),...(b.links||[])])]};
}
const okImg=v=>typeof v==="string" && /^data:image\/(jpeg|png|webp);base64,/.test(v) ? v : "";
function sanitizeDoc(d){
  if(!isObj(d) || typeof d.id!=="string" || !/^[A-Za-z0-9_\-]{1,64}$/.test(d.id)) return null;
  const o=clean(d); if("slipData" in o) o.slipData=okImg(o.slipData); o.slipUrl=""; o.slipId=""; return o;
}
function importData(obj){
  if(!isObj(obj) || obj.app!=="pemo") throw new Error("not pemo");
  const st={newTrips:[],merged:[],add:0,upd:0,del:0,acts:0,from:obj.from?.nick||"เพื่อน"};
  const trips = obj.kind==="backup" ? (obj.trips||[]) : [obj.trip];
  for(const t0 of trips){ const t=sanitizeDoc(t0); if(!t) continue;
    if(!Array.isArray(t.members)) t.members=[];
    const had=RS.trips[t.id]; RS.trips[t.id]=mergeTrip(had,t);
    (had?st.merged:st.newTrips).push(t.name||"ทริป");
    RS.meta[t.id]={...(RS.meta[t.id]||{}),lastIn:Date.now(),lastFrom:st.from};
  }
  for(const e0 of (obj.expenses||[])){ const e=sanitizeDoc(e0); if(!e||!RS.trips[e.tripId]) continue;
    const cur=RS.expenses[e.id], m=mergeDoc(cur,e); if(m===cur) continue;
    if(cur && !e.slipData && cur.slipData && !e._d) m.slipData=cur.slipData; // file sent without slips keeps ours
    RS.expenses[e.id]=m;
    if(!cur){ if(!e._d) st.add++; } else if(e._d && !cur._d) st.del++; else st.upd++;
  }
  for(const a0 of (obj.activities||[])){ const a=sanitizeDoc(a0); if(!a||!RS.trips[a.tripId]) continue;
    const cur=RS.activities[a.id], m=mergeDoc(cur,a); if(m!==cur){ RS.activities[a.id]=m; st.acts++; } }
  for(const [k,p] of Object.entries(isObj(obj.profiles)?obj.profiles:{})){ if(k===DEV||!isObj(p)) continue; RS.profiles[k]=mergeDoc(RS.profiles[k],clean(p)); }
  commit();
  return st;
}
function exportTrip(t,withSlips){
  const ex=Object.values(RS.expenses).filter(e=>e.tripId===t.id).map(e=>withSlips?e:{...e,slipData:""});
  const ac=Object.values(RS.activities).filter(a=>a.tripId===t.id);
  const ids=new Set([DEV,...(t.members||[]).map(m=>m.uid).filter(Boolean)]);
  const profiles=Object.fromEntries([...ids].filter(k=>RS.profiles[k]).map(k=>[k,RS.profiles[k]]));
  return {app:"pemo",v:1,kind:"trip",exportedAt:Date.now(),from:{device:DEV,nick:myNick(),emoji:myEmoji()},trip:RS.trips[t.id],expenses:ex,activities:ac,profiles};
}
function exportAll(){
  return {app:"pemo",v:1,kind:"backup",exportedAt:Date.now(),from:{device:DEV,nick:myNick(),emoji:myEmoji()},
    trips:Object.values(RS.trips),expenses:Object.values(RS.expenses),activities:Object.values(RS.activities),profiles:RS.profiles};
}

/* ---------- link packing ---------- */
function b64u(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ const b=atob(str.replace(/-/g,"+").replace(/_/g,"/")); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function pack(obj){
  const json=JSON.stringify(obj);
  if(window.CompressionStream){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "z"+b64u(new Uint8Array(await new Response(st).arrayBuffer())); }
  return "j"+b64u(new TextEncoder().encode(json));
}
async function unpack(str){
  str=String(str).trim(); const k=str.indexOf("#u="); if(k>=0) str=str.slice(k+3);
  const t=str[0], data=unb64u(str.slice(1));
  if(t==="z"){ const st=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(st).text()); }
  return JSON.parse(new TextDecoder().decode(data));
}

const safeName=n=>String(n||"trip").replace(/[\\/:*?"<>|#%]/g,"").trim().slice(0,40)||"trip";
async function shareOrSave(name,blob,text){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:name,text}); return "shared"; }
    catch(e){ if(e?.name==="AbortError") return "cancel"; }
  }
  if(S.dl){ try{ await S.dl.save({filename:name,data:blob}); return "saved"; }catch{ return "fail"; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); return "saved";
}

function showImport(st){
  const parts=[];
  if(st.newTrips.length) parts.push(`✈️ ทริปใหม่: ${st.newTrips.map(esc).join(", ")}`);
  if(st.merged.length) parts.push(`🔄 อัปเดตทริป: ${st.merged.map(esc).join(", ")}`);
  parts.push(`🧾 เพิ่ม ${st.add} · แก้ ${st.upd} · ลบ ${st.del} รายการ`);
  if(st.acts) parts.push(`🗓️ แผนเที่ยวเปลี่ยน ${st.acts} อย่าง`);
  const nothing=!st.newTrips.length && !st.add && !st.upd && !st.del && !st.acts;
  openSheet(`<div class="empty" style="padding:8px">${pemo(90,nothing?"calm":"happy")}<h2>${nothing?"ข้อมูลตรงกันอยู่แล้ว 👌":"รวมข้อมูลแล้ว!"}</h2><p class="muted" style="margin:4px 0 0">จาก ${esc(st.from)}</p></div>
  <div class="card" style="display:flex;flex-direction:column;gap:6px">${parts.map(p=>`<span>${p}</span>`).join("")}</div>
  ${st.newTrips.length?`<p class="hint" style="margin:0">👉 เข้าทริปแล้วไปแท็บ 👥 แก๊ง กด “นี่คือฉัน 🙋” จะได้รู้ว่าเราคือใครในทริป<br>ถ้าเป็นทริปที่เพื่อนจดแยกจากทริปของเรา ไปที่ 💸 หารเงิน ➜ 🔗 Sync ทริปเพื่อน เพื่อรวมยอด</p>`:""}
  <button class="btn primary block" data-act="close">เยี่ยม</button>`);
}
async function importFiles(files){
  let total=null;
  for(const f of files){
    try{ const st=importData(JSON.parse(await f.text()));
      if(!total) total=st; else { total.newTrips.push(...st.newTrips); total.merged.push(...st.merged); ["add","upd","del","acts"].forEach(k=>total[k]+=st[k]); total.from+=", "+st.from; }
    }catch{ toast(`เปิดไฟล์ ${f.name} ไม่ได้ ไม่ใช่ไฟล์ของ pemo`); }
  }
  if(total) showImport(total);
}
function syncNote(t){
  const m=RS.meta[t.id]||{}; const f=d=>new Date(d).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const bits=[]; if(m.lastOut) bits.push(`📤 ส่งล่าสุด ${f(m.lastOut)}`); if(m.lastIn) bits.push(`📥 รับจาก ${esc(m.lastFrom||"เพื่อน")} ${f(m.lastIn)}`);
  return bits.length?`<p class="hint" style="margin:0;text-align:center">${bits.join(" · ")}</p>`:"";
}

let installEvt=null;
const isStandalone=()=>window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const canInstall=()=>!!APP_URL && !isStandalone();
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; scheduleRender(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; toast("ติดตั้ง pemo แล้ว 🐣 เปิดจากไอคอนบนหน้าจอได้เลย"); scheduleRender(); });

/* ---------- boot ---------- */
(async()=>{
  try{
    DEV=await IDB.get("device"); if(!DEV){ DEV="d"+newId(); await IDB.set("device",DEV); }
    const st=await IDB.get("state"); if(st) RS=st;
  }catch{
    try{ DEV=localStorage.getItem("pemo-dev"); if(!DEV){ DEV="d"+newId(); localStorage.setItem("pemo-dev",DEV); } const ls=localStorage.getItem("pemo-state"); if(ls) RS=JSON.parse(ls); }catch{ DEV=DEV||"d"+newId(); }
  }
  for(const k of ["trips","expenses","activities","profiles","meta"]) RS[k] ||= {};
  S.db=LDB; S.uid=DEV; derive(); S.loaded=true;
  try{ navigator.storage?.persist?.(); }catch{}
  const h=location.hash;
  if(h.startsWith("#u=")){
    try{ history.replaceState(null,"",location.pathname+location.search); }catch{}
    try{ showImport(importData(await unpack(h.slice(3)))); }catch{ toast("ลิงก์อัปเดตไม่ครบ ลองให้เพื่อนส่งเป็นไฟล์แทนนะ"); }
  }
  render();
  if(window.claude?.use) claude.use("downloads").then(d=>S.dl=d).catch(()=>{});
  if("serviceWorker" in navigator && APP_URL) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
